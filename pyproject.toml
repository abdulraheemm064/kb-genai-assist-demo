[project]
name = "kb-genai-assist-demo"
version = "1.0.0"
description = "Knowledge assistant demo: BM25 retrieval, cited extractive answers, optional (disabled) LLM hook, KB drafts from resolved incidents, and KB quality checks on synthetic data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abdul Raheem Mohammed" }]
dependencies = []

[project.scripts]
kb-assist = "kb_assist.cli:main"

[tool.setuptools]
packages = ["kb_assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # word lists via str.split() are more readable here
